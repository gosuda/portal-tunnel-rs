[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"
repository = "https://github.com/gosuda/portal-tunnel"
license = "MIT"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
