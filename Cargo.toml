[workspace]
resolver = "3"
members = [
    "crates/portal-wire",
    "crates/portal-crypto",
    "crates/portal-net",
    "crates/portal-acme",
    "crates/portal-relay",
    "crates/portal-sdk",
    "crates/portal-relay-bin",
    "crates/portal-cli",
    "crates/portal-demo",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/gosuda/portal-tunnel-rs"

[workspace.dependencies]
# Internal member crates
portal-wire = { path = "crates/portal-wire", version = "0.1.0" }
portal-crypto = { path = "crates/portal-crypto", version = "0.1.0" }

# Async runtime + HTTP stack
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
axum = "0.8"
http = "1"
hyper = { version = "1", features = ["full"] }
iri-string = "0.7"
tower = "0.5"

# TLS — rustls MANDATORY (R13). aws_lc_rs provider; prefer-post-quantum opts the
# X25519+ML-KEM-768 hybrid KEX in once rustls negotiates it. Server-side ECH is
# tracked in rustls#1980 and will be added when it lands.
rustls = { version = "0.23.40", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
    "std",
    "tls12",
] }

# Transport + codec
quinn = "0.11"
# Self-signed cert generator for the QUIC backhaul identity (R2 surface 3).
# `aws_lc_rs` feature avoids pulling `ring` per R13 (rustls-MANDATORY); `pem`
# is enabled because rcgen's stable signing-key plumbing requires the `crypto`
# feature group, which `pem` activates as a coupled dependency.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
# socket2 powers the dual-stack `IPV6_V6ONLY=false` listener helper in
# `portal-net::dual_stack` (R12). Pinned independent of tokio's transitive
# pull so direct usage is grep-discoverable.
socket2 = "0.6"
# Pure-Rust X.509 parser used by `SpkiPinVerifier` to extract the leaf cert's
# 32-byte ed25519 SubjectPublicKeyInfo for raw-pubkey pinning.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
bytes = { version = "1", features = ["serde"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
winnow = "1"
bon = "3"

# Time / secrets / strings / concurrency primitives
jiff = { version = "0.2", features = ["serde"] }
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
compact_str = { version = "0.9", features = ["serde"] }
papaya = "0.2"
arc-swap = "1"
governor = "0.10"
figment = { version = "0.10", features = ["env", "json", "toml"] }

# Observability + errors
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
eyre = "0.6"
color-eyre = "0.6"

# CLI + assets + OpenAPI
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["compression"] }
utoipa = "5"
utoipa-axum = "0.2"

# ACME + Ethereum
instant-acme = "0.8"
siwe = "=0.6.1"
alloy = { version = "2.0", default-features = false, features = ["provider-http", "contract"] }
# alloy-ens is the ENS resolver crate. The alloy umbrella's `ens` feature only
# enables the bare `alloy-ens` default features (contract surface only).  The
# `provider` feature is required for `ProviderEnsExt::resolve_name`; it must be
# declared as a direct workspace dependency. Consumed by portal-crypto U11.
alloy-ens = { version = "2.0", features = ["provider"] }

# Crypto + traits
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
trait_variant = { package = "trait-variant", version = "0.1" }

# TUI (R15)
ratatui = { version = "0.30", default-features = false }
ratatui-crossterm = "0.1"

# DNS providers (R14 / Phase 4) — aws-sdk-route53 explicitly opts out of the
# legacy hyper-0.14+rustls-0.21 stack per FEAS-R2-4. MSRV floor 1.95.
aws-sdk-route53 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
] }
# Cloudflare: official Cloudflare-maintained client (BSD-3-Clause). The crate
# carries a "Work in Progress" disclaimer; we mitigate via the `DnsProvider`
# trait — if it bitrots we swap in a hand-rolled `reqwest` shim under the
# same trait without disturbing the rest of `portal-acme`. `default-features
# = false` + `rustls-tls` keeps the workspace clean of native-tls (R13).
cloudflare = { version = "0.14", default-features = false, features = ["rustls-tls"] }
# Native Google Cloud DNS client (Apache-2.0). Pulls rustls/aws-lc-rs by
# default; resolves FEAS-7 in favour of the native SDK over the prior
# `gcp_auth + REST` shim.
google-cloud-dns-v1 = "1.3"

# Overlay (Phase 6b)
smoltcp = { version = "0.13", default-features = false }
brotli = "8"

# Dev-deps register (consumed by member crates' [dev-dependencies])
divan = "0.1"
insta = "1"
proptest = "1"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Workspace dep tree commonly produces multiple major versions of leaf crates
# (rand, hashbrown, getrandom, etc.). We accept the noise here; cargo-deny
# `multiple-versions = "warn"` is the operational gate.
multiple_crate_versions = "allow"
# Stub-crate metadata (readme/keywords/categories) lands in Phase 7 release prep.
cargo_common_metadata = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"
