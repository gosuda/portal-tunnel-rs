[workspace]
resolver = "3"
members = [
    "crates/portal-wire",
    "crates/portal-crypto",
    "crates/portal-net",
    "crates/portal-acme",
    "crates/portal-relay",
    "crates/portal-sdk",
    "crates/portal-relay-bin",
    "crates/portal-cli",
    "crates/portal-demo",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/gosuda/portal-tunnel-rs"

# `[workspace.dependencies]` is the architectural pin register per
# ADR-0002 / Engineering Default R8 — one canonical version per
# approved crate pick, so member crates inherit via
# `<crate> = { workspace = true }` and version drift is caught at one
# location. Pre-positioned pins (e.g., `utoipa`, `smoltcp`, `ratatui`,
# `arc-swap`) document the approved choice for future-batch consumers
# and have zero resolved-tree cost until a member references them.
# Removing a pin requires an ADR-0002 amendment; cargo-machete only
# catches per-member unused entries (not workspace-level pins) by
# design — see `crates/portal-relay/Cargo.toml` for the per-member
# discipline ("Adding deps here ahead of consumers would defeat the
# cargo-machete gate").
[workspace.dependencies]
# Internal member crates
portal-wire = { path = "crates/portal-wire", version = "0.1.0" }
portal-crypto = { path = "crates/portal-crypto", version = "0.1.0" }
portal-net = { path = "crates/portal-net", version = "0.1.0" }
portal-acme = { path = "crates/portal-acme", version = "0.1.0" }
portal-relay = { path = "crates/portal-relay", version = "0.1.0" }
portal-sdk = { path = "crates/portal-sdk", version = "0.1.0" }

# Async runtime + HTTP stack
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
axum = "0.8"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
iri-string = "0.7"
tower = "0.5"
# Async TLS (server + client) layered on rustls — used by the keyless mTLS
# integration test (Phase 6b/A U3) and any future tenant-TLS surfaces that
# need a `TlsAcceptor` / `TlsConnector` over a tokio stream. `default-features
# = false` keeps the dep aligned with the workspace's aws-lc-rs provider
# pin (R13).
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }

# TLS — rustls MANDATORY (R13). aws_lc_rs provider; prefer-post-quantum opts the
# X25519+ML-KEM-768 hybrid KEX in once rustls negotiates it. Server-side ECH is
# tracked in rustls#1980 and will be added when it lands.
rustls = { version = "0.23.40", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
    "std",
    "tls12",
] }
# rustls-pki-types is the rustls ecosystem's stable DER/PEM private-key
# representation. Phase 6b/A U1 (`portal-relay::keyless`) consumes the `alloc`
# (`PemObject` slice iterator) and `std` (PEM-section iter helpers) features
# to load PKCS#8 / PKCS#1 / SEC1 PEM bodies into `PrivateKeyDer<'static>`.
rustls-pki-types = { version = "1", features = ["alloc", "std"] }
# pkcs1 + pkcs8 + sec1 give us the algorithm-detection surface for the
# keyless loader. PKCS#8 v1/v2 carries the algorithm OID in the inner
# AlgorithmIdentifier; SEC1 carries the named-curve OID in `parameters [0]`;
# PKCS#1 is the bare RSA `RSAPrivateKey` structure. Phase 6b/A U1 uses these
# three crates to refuse-to-load anything that is not RSA or ECDSA-P256 AND
# to surface `InvalidKey` for structurally-broken RSA / EC bodies (rather
# than deferring the failure to the U2 signer-construction site).
pkcs1 = { version = "0.7", default-features = false, features = ["std"] }
pkcs8 = { version = "0.10", features = ["std"] }
sec1 = { version = "0.7", default-features = false, features = ["der", "alloc"] }

# Transport + codec
quinn = "0.11"
# Self-signed cert generator for the QUIC backhaul identity (R2 surface 3).
# `aws_lc_rs` feature avoids pulling `ring` per R13 (rustls-MANDATORY); `pem`
# is enabled because rcgen's stable signing-key plumbing requires the `crypto`
# feature group, which `pem` activates as a coupled dependency.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
# socket2 powers the dual-stack `IPV6_V6ONLY=false` listener helper in
# `portal-net::dual_stack` (R12). Pinned independent of tokio's transitive
# pull so direct usage is grep-discoverable.
socket2 = "0.6"
# Pure-Rust X.509 parser used by `SpkiPinVerifier` to extract the leaf cert's
# 32-byte ed25519 SubjectPublicKeyInfo for raw-pubkey pinning.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
bytes = { version = "1", features = ["serde"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
winnow = "1"
bon = "3"

# Time / secrets / strings / concurrency primitives
jiff = { version = "0.2", features = ["serde"] }
secrecy = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
compact_str = { version = "0.9", features = ["serde"] }
papaya = "0.2"
arc-swap = "1"
# Sync `RwLock` consumed by `portal-relay::overlay::wg_device`
# (Phase 6b/B U6) for the per-peer state map; tokio's async locks
# would force `apply_peers` async unnecessarily.
parking_lot = "0.12"
governor = "0.10"
figment = { version = "0.10", features = ["env", "json", "toml"] }

# Observability + errors
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
eyre = "0.6"
color-eyre = "0.6"

# CLI + assets + OpenAPI
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["compression"] }
utoipa = "5"
utoipa-axum = "0.2"

# ACME + Ethereum
instant-acme = "0.8"
siwe = "=0.6.1"
alloy = { version = "2.0", default-features = false, features = ["provider-http", "contract"] }
# alloy-ens is the ENS resolver crate. The alloy umbrella's `ens` feature only
# enables the bare `alloy-ens` default features (contract surface only).  The
# `provider` feature is required for `ProviderEnsExt::resolve_name`; it must be
# declared as a direct workspace dependency. Consumed by portal-crypto U11.
alloy-ens = { version = "2.0", features = ["provider"] }

# Crypto + traits
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# `trait_variant` workspace dep removed per ADR-0002 Amendment 2026-05-04
# (async-fn-in-trait Send-bound shape: trait_variant → explicit
# `impl Future + Send + 'a` RPIT). Zero member crates consumed it; the
# canonical pattern lives at `crates/portal-crypto/src/ens/alloy_resolver.rs`.
# aws-lc-rs is a transitive dep through `rustls`'s `aws_lc_rs` feature; we
# additionally declare it at workspace level so dev-deps can `use aws_lc_rs`
# directly for signature-verification helpers in integration tests
# (notably the keyless mTLS round-trip test in `portal-relay`). Default
# features are kept to inherit the same prebuilt-NASM / fips toggles
# rustls relies on so the dev-dep does not silently rebuild aws-lc-rs.
aws-lc-rs = "1"

# TUI (R15)
ratatui = { version = "0.30", default-features = false }
ratatui-crossterm = "0.1"

# DNS providers (R14 / Phase 4) — aws-sdk-route53 explicitly opts out of the
# legacy hyper-0.14+rustls-0.21 stack per FEAS-R2-4. MSRV floor 1.95.
aws-sdk-route53 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
] }
# Cloudflare: official Cloudflare-maintained client (BSD-3-Clause). The crate
# carries a "Work in Progress" disclaimer; we mitigate via the `DnsProvider`
# trait — if it bitrots we swap in a hand-rolled `reqwest` shim under the
# same trait without disturbing the rest of `portal-acme`. `default-features
# = false` + `rustls-tls` keeps the workspace clean of native-tls (R13).
cloudflare = { version = "0.14", default-features = false, features = ["rustls-tls"] }
# Native Google Cloud DNS client (Apache-2.0). Pulls rustls/aws-lc-rs by
# default; resolves FEAS-7 in favour of the native SDK over the prior
# `gcp_auth + REST` shim. `google-cloud-auth` ships the service-account
# credential builder used in production and the anonymous-credential
# builder used by the wiremock contract test (skips OAuth fetch);
# `google-cloud-gax` exposes the `with_endpoint` / `with_credentials`
# client-builder surface shared across all Google native SDKs.
google-cloud-dns-v1 = "1.3"
google-cloud-auth = "1"
google-cloud-gax = "1"

# Overlay (Phase 6b)
smoltcp = { version = "0.13", default-features = false }
brotli = "8"
# Userspace WireGuard data plane — primary pick per ADR-0015 (Apache-2.0
# OR MIT, server-side-validated under defguard's commercial gateway,
# safe public API, IPv6 carriage tracked). The sealed `WgDevice`
# adapter (ADR-0014) wraps this dep at U6 consumption time. Secondary
# fork (NepTUN) is documented in ADR-0015 behind a license-review gate
# and is not declared here — promotion lands as an ADR amendment.
defguard_boringtun = "0.6.5"

# Dev-deps register (consumed by member crates' [dev-dependencies])
divan = "0.1"
insta = "1"
proptest = "1"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Workspace dep tree commonly produces multiple major versions of leaf crates
# (rand, hashbrown, getrandom, etc.). We accept the noise here; cargo-deny
# `multiple-versions = "warn"` is the operational gate.
multiple_crate_versions = "allow"
# Stub-crate metadata (readme/keywords/categories) lands in Phase 7 release prep.
cargo_common_metadata = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

# rustdoc-clean as of iteration 54 (all 9 crates audited; 51 broken
# links repaired across 5 commits per Codex split-scope rule). Lock
# the clean state in so future contributors hit a hard gate before
# the warnings can accumulate again. clippy's `-D warnings` (already
# in CI + xtask ci) escalates these to errors at CI time.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"
