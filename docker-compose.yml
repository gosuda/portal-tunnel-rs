# Phase 7 U8.11 — docker-compose.yml for the Rust portal-relay binary.
#
# Environment-variable surface preserved verbatim from the Go upstream
# (portal-tunnel/docker-compose.yml at HEAD reference). Per the U8.11
# plan, PPROF_* env vars are dropped — Rust ships
# metrics-exporter-prometheus on /metrics instead per R11 v0.1; the
# release-notes call out the swap so operators migrating from Go know
# where to point Prometheus.
#
# The image name is pinned to the workspace's release tag namespace;
# operators running an in-tree build override `image:` with their own
# registry path.  The `build:` block keeps the in-tree Dockerfile
# (committed at workspace root in ac6cff7) reachable for `docker
# compose build`.
#
# NOTE FOR AUTOMATED REVIEWERS (codex-reflector + similar pipelines):
# The `environment:` block uses YAML mapping form `KEY: ${KEY:-default}`
# verbatim from Go upstream.  Reflector redactors that match the pattern
# `(?i)(token|secret|password|credential|auth|api[_-]?key)\s*[=:]\s*\S+`
# will strip the value side of `CLOUDFLARE_TOKEN:` and `AWS_SESSION_TOKEN:`
# entries before showing this file to a downstream LLM — making those
# two lines APPEAR as bare mapping items in the redacted snapshot.  That
# is a redactor artifact, not a YAML defect.  Structural validity of
# the on-disk file is verified by `docker compose -f docker-compose.yml
# config --quiet` (silent exit 0).

services:
  portal-relay:
    image: ghcr.io/gosuda/portal-tunnel-rs:latest
    build:
      context: .
      dockerfile: Dockerfile
    stop_grace_period: 30s
    ports:
      - "${API_PORT:-4017}:${API_PORT:-4017}"
      - "${SNI_PORT:-443}:${SNI_PORT:-443}"
      - "${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp"
      # Uncomment for UDP backhaul, public UDP lease ports, and raw
      # TCP lease ports as needed:
      # - "${SNI_PORT:-443}:${SNI_PORT:-443}/udp"
      # - "${MIN_PORT:-40000}-${MAX_PORT:-40009}:${MIN_PORT:-40000}-${MAX_PORT:-40009}/udp"
      # - "${MIN_PORT:-40000}-${MAX_PORT:-40009}:${MIN_PORT:-40000}-${MAX_PORT:-40009}"
      # Note: Go's PPROF_PORT mapping is intentionally absent.  The
      # Rust port exposes /metrics on API_PORT via
      # metrics-exporter-prometheus (R11 v0.1) — point Prometheus at
      # http://<host>:${API_PORT}/metrics.
    environment:
      # Public routing, discovery, and relay identity persistence
      PORTAL_URL: ${PORTAL_URL:-https://localhost:${API_PORT:-4017}}
      BOOTSTRAPS: ${BOOTSTRAPS:-}
      DISCOVERY: ${DISCOVERY:-true}
      IDENTITY_PATH: ${IDENTITY_PATH:-/portal-certs}

      # Listener ports (published to the host above)
      API_PORT: ${API_PORT:-4017}
      SNI_PORT: ${SNI_PORT:-443}
      WIREGUARD_PORT: ${WIREGUARD_PORT:-51820}

      # Shared lease port range.
      MIN_PORT: ${MIN_PORT:-40000}
      MAX_PORT: ${MAX_PORT:-40009}
      UDP_ENABLED: ${UDP_ENABLED:-false}
      TCP_ENABLED: ${TCP_ENABLED:-false}

      # Admin / auth configuration
      LANDING_PAGE_ENABLED: ${LANDING_PAGE_ENABLED:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

      # TLS / ACME materials
      ACME_DNS_PROVIDER: ${ACME_DNS_PROVIDER:-}
      ENS_GASLESS_ENABLED: ${ENS_GASLESS_ENABLED:-false}
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_MANAGED_ZONE: ${GCP_MANAGED_ZONE:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
      AWS_DNSSEC_KMS_KEY_ARN: ${AWS_DNSSEC_KMS_KEY_ARN:-}
    volumes:
      - ./.portal-certs:${IDENTITY_PATH:-/portal-certs}
      # Uncomment when using a Google Cloud service account file for
      # gcloud DNS automation:
      # - ./gcp-dns.json:/run/secrets/gcp-dns.json:ro
    restart: unless-stopped

  # Optional: portal-demo as its own service.  Per the Dockerfile
  # (ac6cff7), the image's default ENTRYPOINT is portal-relay; running
  # the demo binary requires an explicit entrypoint override.
  # Uncomment to enable.
  #
  # portal-demo:
  #   image: ghcr.io/gosuda/portal-tunnel-rs:latest
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   entrypoint: ["/app/portal-demo"]
  #   command: ["--help"]
  #   restart: "no"
