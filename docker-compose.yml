services:
  portal-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: portal-relay-rs:local
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${API_PORT:-4017}:${API_PORT:-4017}"
      - "${SNI_PORT:-443}:${SNI_PORT:-443}"
      # Enable when discovery/overlay mesh support is used.
      # - "${WIREGUARD_PORT:-51820}:${WIREGUARD_PORT:-51820}/udp"
      # Enable when UDP backhaul is used.
      # - "${SNI_PORT:-443}:${SNI_PORT:-443}/udp"
      # Enable when UDP/TCP lease ports are used.
      # - "${MIN_PORT:-40000}-${MAX_PORT:-40009}:${MIN_PORT:-40000}-${MAX_PORT:-40009}/udp"
      # - "${MIN_PORT:-40000}-${MAX_PORT:-40009}:${MIN_PORT:-40000}-${MAX_PORT:-40009}"
    environment:
      PORTAL_URL: ${PORTAL_URL:-https://localhost:${API_PORT:-4017}}
      IDENTITY_PATH: /portal-certs
      API_PORT: ${API_PORT:-4017}
      SNI_PORT: ${SNI_PORT:-443}
      MIN_PORT: ${MIN_PORT:-0}
      MAX_PORT: ${MAX_PORT:-0}
      UDP_ENABLED: ${UDP_ENABLED:-false}
      TCP_ENABLED: ${TCP_ENABLED:-false}
      DISCOVERY: ${DISCOVERY:-false}
      LANDING_PAGE_ENABLED: ${LANDING_PAGE_ENABLED:-true}
      WIREGUARD_PORT: ${WIREGUARD_PORT:-51820}
      BOOTSTRAPS: ${BOOTSTRAPS:-}
      RUST_LOG: ${RUST_LOG:-portal_relay=debug,tokio_wireguard=info,info}
    volumes:
      - portal-certs:/portal-certs

volumes:
  portal-certs:
