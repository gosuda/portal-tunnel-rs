# Workspace-level clippy configuration.
#
# R2 trust-boundary isolation: each key role has exactly one loader function.
# No bundled multi-key loader may exist.
#
# `disallowed-methods` requires a resolvable qualified Rust path.  The entry
# below targets `portal_crypto::load_all_keys` — the canonical wrong name a
# contributor would reach for when trying to create a multi-key bundle loader.
# Clippy emits a hard error at any call site to that exact symbol; contributors
# see the reason string pointing at the correct per-role API.  Definition of
# the symbol itself is caught by the CI regex gate (see below).
#
# Return-type enforcement (banning `fn … -> (SecretBox<A>, SecretBox<B>)`)
# cannot be expressed via `disallowed-methods` (no return-type predicate).
# That enforcement is the responsibility of the CI regex gate defined in
# `.github/workflows/ci.yml` (job "Multi-key-return regex gate").
#
# ADR-0002 § R2 / Phase 2 plan U12.

disallowed-methods = [
    # `allow-invalid = true` suppresses the "not a reachable function" warning
    # that clippy emits when the guarded symbol does not yet exist. This entry
    # is an intentional architectural sentinel (ADR-0002 R2): it would block any
    # call site the moment someone defines and calls `load_all_keys`.
    { path = "portal_crypto::load_all_keys", reason = "use the per-role load_*_key functions (R2 trust-boundary isolation per ADR-0002)", allow-invalid = true },

    # Phase 7 U8.8 — utoipa coverage gate.
    #
    # Library crates (`portal-relay`, `portal-sdk`) MUST register routes via
    # `utoipa_axum::OpenApiRouter::route` / `OpenApiRouter::nest` so utoipa's
    # `ApiDoc::openapi()` carries the full surface; calling `axum::Router::route`
    # / `Router::nest` bypasses the OpenAPI registration silently. Binary crates
    # (`portal-relay-bin`, `portal-cli`, `portal-demo`) compose finalised routers
    # at the mount site and may locally `#[expect(clippy::disallowed_methods,
    # reason = "binary crate composes routers from documented utoipa registrations")]`
    # at that single call site. Policy + escape procedure: docs/utoipa-coverage-policy.md.
    #
    # Belt-and-suspenders: the `utoipa-coverage-gate` job in
    # `.github/workflows/ci.yml` runs an ast-grep scan that catches the syntactic
    # shape regardless of import alias — clippy `disallowed-methods` resolves on
    # qualified path, ast-grep on AST shape; together they catch each other's
    # blind spots.
    { path = "axum::Router::route", reason = "library crates: use utoipa_axum::OpenApiRouter::route; binary crates: #[expect(clippy::disallowed_methods, reason = \"composes utoipa-registered routers\")] at the mount site (Phase 7 U8.8 — see docs/utoipa-coverage-policy.md)" },
    { path = "axum::Router::nest", reason = "library crates: use utoipa_axum::OpenApiRouter::nest; binary crates: #[expect(clippy::disallowed_methods, reason = \"composes utoipa-registered routers\")] at the mount site (Phase 7 U8.8 — see docs/utoipa-coverage-policy.md)" },

    # R9 — structured-concurrency invariant.
    #
    # Free `tokio::spawn` is permitted only at the very top of `main` (the binary
    # crate's runtime entry point). Library code must register every spawned
    # task in a caller-owned `tokio::task::JoinSet` OR (when the task is
    # explicitly designed to outlive any caller) carry a
    # `tokio_util::sync::CancellationToken` plus a stored `JoinHandle` that the
    # owning struct's shutdown method awaits. Sites that legitimately need
    # `tokio::spawn` apply `#[expect(clippy::disallowed_methods, reason = "...")]`
    # at the call site naming the architectural justification — typically one
    # of "lifecycle-collapsing detached drain" or "structured spawn satisfies
    # R9 OR clause via stored JoinHandle + CancellationToken". Test code
    # (`#[cfg(test)]`, integration tests under `tests/`) may use `tokio::spawn`
    # freely with `#[expect(...)]` and the reason "test".
    #
    # Origin: ADR-0002 / Engineering Defaults R9 / docs/architecture.md
    # §Structured concurrency invariant.
    { path = "tokio::spawn", reason = "R9: spawn into a caller-owned JoinSet, OR carry a CancellationToken + stored JoinHandle. Apply #[expect(clippy::disallowed_methods, reason = \"...\")] at audited sites (lifecycle-collapsing detached drain, structured spawn with R9 OR-clause, or test code) — see docs/architecture.md §R9" },
]
