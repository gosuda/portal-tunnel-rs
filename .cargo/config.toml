# Workspace cargo config — task aliases + sparse registry.
#
# cargo-vet supply-chain audit harness landed in Phase 5 Batch 1
# (commit 90e9fb7); audits + config live under `supply-chain/`. The
# `cargo vet check` gate runs as warn-only inside `cargo xtask ci`
# during Phase 5 per the cargo-vet incremental-adoption posture and
# becomes a hard CI gate in Phase 7 release work. See
# CONTRIBUTING.md §`Certifying dependencies` for the per-PR
# `cargo vet certify` workflow.

[registries.crates-io]
protocol = "sparse"

[net]
git-fetch-with-cli = true

[alias]
# `cargo xtask <task>` — workspace task runner stub.
xtask = "run --package xtask --release --"

# `cargo cov` — alias for cargo-llvm-cov.
cov = "llvm-cov --workspace"

# `cargo bench-divan` — divan harness; criterion runs under `cargo bench`.
bench-divan = "bench --bench divan"

# `cargo ci` — local mirror of the CI workflow gate set; runs the same
# checks as .github/workflows/ci.yml on a single machine.
ci = "xtask ci"
