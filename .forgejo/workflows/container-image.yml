name: Build and publish container image

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and push image
    runs-on: docker
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: code.rly.best
      IMAGE_NAME: gofix/portal-tunnel-rs
      DOCKER_CONFIG: ${{ github.workspace }}/.docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare registry authentication
        shell: sh
        env:
          REGISTRY_USER: gofix
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "REGISTRY_TOKEN secret is not configured" >&2
            exit 1
          fi
          mkdir -p "$DOCKER_CONFIG"
          auth="$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 | tr -d '\n')"
          cat > "$DOCKER_CONFIG/config.json" <<JSON
          {"auths":{"$REGISTRY":{"auth":"$auth"}}}
          JSON

      - name: Build and publish image with Kaniko
        uses: docker://gcr.io/kaniko-project/executor:debug
        env:
          DOCKER_CONFIG: ${{ env.DOCKER_CONFIG }}
        with:
          args: >-
            --context=${{ github.workspace }}
            --dockerfile=${{ github.workspace }}/Dockerfile
            --destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            --destination=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            --label=org.opencontainers.image.source=https://code.rly.best/gofix/portal-tunnel-rs
            --label=org.opencontainers.image.revision=${{ github.sha }}
            --label=org.opencontainers.image.version=${{ github.ref_name }}
            --cleanup
