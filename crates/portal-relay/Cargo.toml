[package]
name = "portal-relay"
version = "0.1.0"
description = "Relay-server library — lease, api, server, policy, discovery, overlay, keyless."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Phase 5 Batch 1 ships only the skeleton modules; each subsequent
# unit (U3..U17) lands its own deps alongside the consuming code.
# Adding deps here ahead of consumers would defeat the cargo-machete
# gate.
#
# Phase 5 Batch 2 (U3 listeners + U4 partial identity) adds:
# - portal-net (R12-canon re-export, QuicIdentityKey, NetError pass-through)
# - portal-crypto (ApiHttpsKey newtype field on RelayIdentity)
# - secrecy (SecretBox<KeyType> R2 trust-boundary newtypes)
# - tokio { fs, io-util } (async filesystem load path for the identity dir)
#
# Phase 5 Batch 3 (U5 atomic JSON persistence) adds:
# - serde + serde_json (typed JSON write/read surface)
# - tracing (warn on stale .tmp orphan during read_json)
# - tokio { rt } (spawn_blocking for parent-directory fsync on POSIX)
#
# Phase 5 Batch 4 (U7 minimal lease registry) adds:
# - papaya (lock-free `HashMap` for the identity + hostname tables)
# - jiff (Timestamp values on `LeaseRecord`)
#
# Phase 5 Batch 6 (U8 api envelope + per-surface state + empty router
# scaffolds) adds:
# - axum (Router + Json + IntoResponse for the API surface;
#   `axum::http::StatusCode` is re-exported and the only http-crate
#   surface this crate currently consumes — there is no direct
#   `http = { workspace = true }` dependency until a consumer
#   actually imports `http::*` directly. cargo-machete enforces.)
#
# Phase 5 Batch 9 (U16 server orchestrator skeleton) adds:
# - tokio-util (CancellationToken for janitor cancellation)
# - tokio { time } (interval driver for the 5s lease janitor)
#
# Phase 6b/A Batch 1 first half (U1 — keyless module skeleton + PEM loader)
# adds:
# - rustls-pki-types (PEM → PrivateKeyDer<'static> variant detection)
# - pkcs1 (RFC 8017 RSAPrivateKey structural validation on load)
# - pkcs8 (PKCS#8 v1/v2 AlgorithmIdentifier OID inspection + body validation)
# - sec1 (SEC1 EcPrivateKey curve-OID inspection for P-256 enforcement)
# - zeroize (Zeroizing<Vec<u8>> wrap inside the private KeyMaterial enum)
#
# Phase 6b/A Batch 1 second half (U2 — KeylessSignerAdapter + async-bridge
# worker pool + ADR-0016) adds:
# - rustls (direct: `rustls::sign::{SigningKey, Signer}` trait surface and
#   `rustls::crypto::aws_lc_rs::sign::any_supported_type` for delegating
#   crypto primitives — workspace policy is "use rustls's own provider,
#   don't roll our own", per ADR-0014 / ADR-0016).
#
# Phase 6b/A Batch 2 first half (U3 — keyless axum mTLS endpoint + SEC-004
# protections + signrpc-equivalent wire) adds:
# - portal-wire (KEYLESS_REQUEST domain separator + KEYLESS_PAYLOAD_BUDGET
#   limit constant — wire-protocol surface lives in portal-wire per the
#   U16 drift gate).
# - postcard (canonical SignRequest signing-input encoding — SEC-007).
# - governor (per-tenant rate limit keyed by client-cert subject; papaya-
#   backed map of `DefaultDirectRateLimiter` instances).
# - hyper-util + http + tower (axum's Service primitive plumbed onto a
#   `tokio_rustls::TlsAcceptor` so the keyless ServerConfig is
#   constructed locally to this module — never aliased into state/ or
#   listeners/, per R2 trust-boundary discipline). S8 adds direct
#   `hyper` for `hyper::upgrade::on` in the SDK connect hijack path;
#   hyper-util remains used for `hyper_util::server::conn::auto::Builder`,
#   `hyper_util::service::TowerToHyperService`, and `hyper_util::rt::TokioIo`.
# - tokio-rustls (TlsAcceptor over a TcpListener for the mTLS endpoint
#   bind in `keyless::api`).
# - rcgen + tokio-rustls + http-body-util (dev-only; integration test
#   spins up a real mTLS server with rcgen-generated CA + client + server
#   certs, then issues a real TLS handshake with `tokio_rustls::TlsConnector`).
#
# Phase 6b/B Batch 1 (U6 — sealed `WgDevice` trait + defguard_boringtun
# adapter) adds:
# - defguard_boringtun (the userspace WireGuard data plane — primary
#   fork per ADR-0015; consumed only via `noise::Tunn` + `x25519` +
#   `noise::rate_limiter::RateLimiter` so the fully-safe public API
#   surface is preserved per ADR-0014's `unsafe_code = "forbid"` hard
#   gate). cargo-vet audit lands in the same Phase 5/U6 vet workflow
#   that owns supply-chain gating.
# - parking_lot (sync `RwLock` for the per-peer state map in
#   `overlay::wg_device`; tokio's async lock would force
#   `apply_peers` async unnecessarily).
# - rand_core (workspace pin v0.6) — `OsRng` for the `with_random_key`
#   construction-site path (unit tests + the U7 first-run init).
#
# Phase 5 U13 follow-up (file-watcher behind `config_file_watch`) adds
# the OPT-IN deps `notify` + `notify-debouncer-full`. Both are
# `optional = true` and gated on the `config_file_watch` feature so
# the default-features build does NOT pull either crate; the dep
# matrix stays narrow in v0.1 per the U13 plan.
[features]
default = []
# Enables `reload::file_watch::watch_runtime_config` and pulls the
# `notify` + `notify-debouncer-full` filesystem-event backend.
config_file_watch = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
arc-swap = { workspace = true }
axum = { workspace = true }
# `base64` (Phase 5 SDK-API S1) — `<base64url(payload)>.<base64url(sig)>`
# framing for `state::lease_token` access tokens. Only the
# `URL_SAFE_NO_PAD` engine constant is consumed.
base64 = { workspace = true }
compact_str = { workspace = true, features = ["serde"] }
defguard_boringtun = { workspace = true }
# `ed25519-dalek` (Phase 5 SDK-API S1) — `Signature::from_bytes` /
# `Signature::to_bytes` for the lease-access-token verify path,
# which converts the on-the-wire 64-byte signature blob into the
# `Ed25519Verifier::verify_with_separator` call argument. Only the
# `Signature` type surface is consumed; signing-key construction
# stays inside `portal-crypto`.
ed25519-dalek = { workspace = true }
# Phase 5 U13 follow-up (env-var override for `RuntimeConfig` loading)
# adds figment as a non-optional dep. The workspace pin enables the
# `env`, `json`, and `toml` features; this crate consumes only the
# `Json::file` and `Env::prefixed` provider chain via
# `RelayConfigBundle::from_files_with_env`. Bootstrap stays strict —
# `RelayServerConfig` continues to load through `serde_json` directly
# since trust-boundary key paths must not be env-overridable.
figment = { workspace = true }
governor = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
jiff = { workspace = true }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
papaya = { workspace = true }
parking_lot = { workspace = true }
pkcs1 = { workspace = true }
pkcs8 = { workspace = true }
portal-crypto = { workspace = true, features = ["rustls-integration"] }
portal-net = { workspace = true }
portal-wire = { workspace = true }
postcard = { workspace = true }
rand_core = { workspace = true }
ratatui = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile = { workspace = true }
sec1 = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "sync",
    "time",
    "net",
] }
# `siwe` (Phase 5 SDK-API S3) — `siwe::Message::from_str` parse path
# inside `state::lease_registry::consume_register_challenge`, which
# re-parses the pinned message text before calling
# `portal_crypto::verify_binding(&Message, ...)`. Only the `Message`
# parse + the trait `FromStr` surface is consumed; the EIP-191
# verifier is reached through `portal_crypto`.
siwe = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
# `uuid` (Phase 5 SDK-API S3) — UUIDv4 stringified `challenge_id` in
# `state::lease_registry::issue_register_challenge`. Only `Uuid::new_v4()`
# is consumed; no serde/borsh surface. Mirrors Go's
# `auth.NewRegisterChallenge` which seeds challenge IDs from
# `crypto/rand`.
uuid = { workspace = true }
# Phase 6b/B Batch 3 (U7 — smoltcp-backed overlay netstack) adds:
# - smoltcp (in-process TCP/IP+UDP stack that bridges to the `WgDevice`
#   trait via `smoltcp::phy::Device`; consumed only in `overlay::netstack`
#   and `overlay::hop_mux`).
# `alloc` is required so smoltcp compiles its `ManagedSlice::Owned` arm
# (upstream 0.13.1 `socket_set.rs` is non-exhaustive without it).
smoltcp = { workspace = true, features = [
    "alloc",
    "proto-ipv4",
    "proto-ipv6",
    "medium-ip",
    "socket-udp",
    "socket-tcp",
] }
zeroize = { workspace = true }

[dev-dependencies]
aws-lc-rs = { workspace = true }
# Self-reference activates `insecure-test-constructors` so the
# `state::lease_token` inline tests can reach
# `portal_crypto::ed25519_from_seed_for_test` without leaking the gate
# to production. Same pattern as `portal-net`'s dev-dep stanza.
portal-crypto = { workspace = true, features = ["insecure-test-constructors"] }
# Phase 5 U13 follow-up: the env-var override tests for
# `RelayConfigBundle::from_files_with_env` use `figment::Jail` for
# scoped env-var isolation. The `Jail` type is gated on figment's
# `test` feature, which is dev-only; it must NOT appear in the
# production figment dep above (operator deployments don't need a
# tempdir-rebinding jail).
figment = { workspace = true, features = ["test"] }
http-body-util = { workspace = true }
pkcs1 = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Phase 5 U13 (`tests/arc_swap_reload.rs`): the JSON formatter is the
# audit-event emission test's structural assertion path — substring
# matching the text formatter's output is brittle to format toggles.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
