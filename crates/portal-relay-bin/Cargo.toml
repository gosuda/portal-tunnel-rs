[package]
name = "portal-relay-bin"
version = "0.1.0"
description = "Relay-server binary; ships the embedded admin SPA + docs site bundle."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "portal-relay"
path = "src/main.rs"

[dependencies]
# Cross-crate
portal-acme = { workspace = true }
portal-relay = { workspace = true }

# CLI parsing
clap = { workspace = true, features = ["derive"] }

# Async runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

# Errors + tracing
eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

# Compact strings for config types
compact_str = { workspace = true }

# JSON serialization for the `init` subcommand scaffolds bootstrap.json
# + runtime.json via the iter-124 serde derives on the portal-relay
# config types.
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }

[lints]
workspace = true
