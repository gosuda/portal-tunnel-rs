[package]
name = "portal-relay-bin"
version = "0.1.0"
description = "Relay-server binary; ships the embedded admin SPA + docs site bundle."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "portal-relay"
path = "src/main.rs"
# `cargo doc --workspace` would write this bin's rustdoc to
# `target/doc/portal_relay/index.html`, the same path the
# `portal-relay` library crate writes to. Disable bin rustdoc to
# prevent the order-of-build shadowing (cargo's collision warning
# does not abort the build, so the second target overwrites the
# first's docs). The bin's user-facing surface is `--help`, not
# rustdoc; the library crate's docs are the meaningful artifact.
doc = false

[features]
default = []
# Operator-opt-in filesystem watcher that converts
# `runtime.json` writes into `ReloadHandle::reload(...)` calls. The
# watcher itself lives in `portal-relay`; this feature propagates the
# flag so the binary's `serve` body can spawn the watcher when the
# operator has run `init` (or hand-written both config files).
config_file_watch = ["portal-relay/config_file_watch"]

[dependencies]
# Cross-crate
portal-acme = { workspace = true }
portal-relay = { workspace = true }

# CLI parsing
clap = { workspace = true, features = ["derive"] }

# Terminal UI
ratatui = { workspace = true }
ratatui-crossterm = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

# Errors + tracing
eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

# Compact strings for config types
compact_str = { workspace = true }

# JSON serialization for the `init` subcommand scaffolds bootstrap.json
# + runtime.json via the serde derives on the portal-relay config types
# (RelayServerConfig + RuntimeConfig).
serde = { workspace = true }
serde_json = { workspace = true }

# Runtime manifest parsing: the upstream `config.toml` is embedded via
# `include_str!` and parsed lazily at program start via `OnceLock`.
toml = { workspace = true }

[dev-dependencies]
# Phase 5 B8 follow-up (`tests/load_bundle_with_env.rs`): the binary-
# level env-overlay integration tests use `figment::Jail` for scoped
# env-var isolation. The `Jail` type is gated on figment's `test`
# feature, which is dev-only — the binary never imports figment
# directly; it goes through `portal-relay`'s `from_files_with_env`.
figment = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }

[lints]
workspace = true
