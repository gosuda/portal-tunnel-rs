[package]
name = "portal-sdk"
version = "0.1.0"
description = "Client SDK — expose orchestration, lease listener, MITM probe, eclipse-resistant relay picker."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Cross-crate (Phase 1/3 outputs)
portal-net = { workspace = true }
portal-wire = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

# Domain primitives
compact_str = { workspace = true }
jiff = { workspace = true }

# Errors + tracing
thiserror = { workspace = true }
tracing = { workspace = true }

# TLS — required for the RFC 5705 EKM exporter helper in `mitm.rs`.
# Pulled from the workspace pin (rustls 0.23 + aws_lc_rs provider per R13).
rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# The MITM probe behavioral gate drives a full in-memory rustls
# handshake; rcgen mints the self-signed cert and rustls itself is
# imported directly to construct configs and the test's noop verifier.
rcgen = { workspace = true }
rustls = { workspace = true }

[lints]
workspace = true
