[package]
name = "portal-crypto"
version = "0.1.0"
description = "Cryptographic primitives — ed25519 protocol identity, k256 SIWE, signed envelopes, keyless oracle."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
## Enables `ApiHttpsKey` and `api_https_signing_key`, which wrap
## `Arc<dyn rustls::sign::SigningKey>`.  Gated because `rustls` with the
## `aws_lc_rs` feature pulls `aws-lc-sys → cmake`, which the workspace
## `deny.toml` bans under default features (`all-features = false`).
## portal-relay activates this feature when building the API HTTPS surface.
## portal-relay MUST activate this feature when wiring the API HTTPS surface
## (Phase 5): `portal-crypto = { workspace = true, features = ["rustls-integration"] }`.
rustls-integration = ["dep:rustls"]
## Exposes deterministic seed-to-key constructors (`from_seed_for_test`,
## `from_bytes_for_test`) that are UNSAFE for production use (fixed seeds
## produce predictable keys).  Must never be enabled in production builds.
## This crate's own integration tests (tests/ dir) activate it via the
## self-referencing dev-dependency below (`portal-crypto = { path = ".",
## features = ["insecure-test-constructors"] }`), because tests/ binaries
## compile the library as a normal (non-cfg(test)) dependency.
insecure-test-constructors = []

[dependencies]
alloy = { workspace = true }
alloy-ens = { workspace = true }
rustls = { workspace = true, optional = true }
bytes = { workspace = true }
compact_str = { workspace = true }
ed25519-dalek = { workspace = true }
http = { workspace = true }
iri-string = { workspace = true }
jiff = { workspace = true }
k256 = { workspace = true }
postcard = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
siwe = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
portal-wire = { workspace = true }

[dev-dependencies]
# Self-reference: activates `insecure-test-constructors` so integration tests
# in tests/ can reach `ed25519_from_seed_for_test` / `secp256k1_from_bytes_for_test`.
# The library is compiled as a normal dep by tests/ binaries (not cfg(test)),
# so cfg(test) alone cannot open those gates — the feature must be explicit.
portal-crypto = { path = ".", version = "0.1.0", features = ["insecure-test-constructors"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
