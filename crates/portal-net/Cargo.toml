[package]
name = "portal-net"
version = "0.1.0"
description = "QUIC backhaul + TCP/UDP relay primitives for portal-tunnel-rs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = { workspace = true }
compact_str = { workspace = true }
ed25519-dalek = { workspace = true }
jiff = { workspace = true }
papaya = { workspace = true }
portal-crypto = { workspace = true }
portal-wire = { workspace = true }
postcard = { workspace = true }
quinn = { workspace = true }
rand_core = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
secrecy = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
x509-cert = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Self-reference activates `insecure-test-constructors` so unit tests can
# reach `ed25519_from_seed_for_test` without leaking the gate to production
# (jiff is already in [dependencies] for the QUIC backhaul control window).
portal-crypto = { workspace = true, features = ["insecure-test-constructors"] }
tempfile = { workspace = true }
# `tracing-subscriber` is used by the U11 behavioral-gate integration tests
# under `tests/` to surface `RUST_LOG=portal_net=debug` output during failure
# investigation. The `fmt` feature ships in the default set; we list it
# explicitly alongside `env-filter` so a future workspace-level
# `default-features = false` flip does not silently break our tests.
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints]
workspace = true
