name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  PROPTEST_CASES: "4096"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt
      - run: cargo fmt --all --check

  wire-protocol-gates:
    name: wire-protocol drift + v0.1 ReputationDelta gate (U16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Spec drift vs crates/portal-wire HEAD
        run: cargo run -p xtask --quiet -- wire-drift-check
      - name: v0.1 crates must not construct ReputationDelta on the wire
        run: |
          set -euo pipefail
          targets=(
            crates/portal-relay
            crates/portal-net
            crates/portal-sdk
            crates/portal-cli
            crates/portal-relay-bin
            crates/portal-demo
          )
          if rg --line-number --fixed-strings \
            -e 'ReputationDelta::new' -e 'ReputationDelta {' \
            "${targets[@]}"; then
            echo "::error::U16 gate: v0.1 crates must not emit ReputationDelta (R10 v0.2 only)."
            exit 1
          fi

  taplo:
    name: taplo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - run: taplo fmt --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.95", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Second pass with --all-features to surface compile/lint
      # errors in feature-gated modules. The default-features pass
      # above doesn't compile modules behind off-by-default features
      # (e.g. portal-crypto::api_https behind `rustls-integration`),
      # so a missing import / stale type reference inside a gated
      # module can slip through and only surface when a downstream
      # caller enables the feature. Mirrored locally by `cargo xtask
      # ci`'s clippy-all-features step.
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # R2 trust-boundary isolation gate (Phase 2 U12).
  #
  # Bans function signatures whose return type contains two or more SecretBox
  # or SigningKey occurrences on the same line, which is the fingerprint of an
  # illegal multi-key-bundle loader written in standard (non-rustfmt-wrapped)
  # style.
  #
  # Limitation: rustfmt-wrapped multi-line return types are not caught by a
  # line-based rg scan.  Those cases are covered by code review and the
  # disallowed-methods clippy entry in clippy.toml.  A future batch may add
  # an xtask/ast-grep gate for the multiline case.
  # Multi-line rustfmt-wrapped signature gap is tracked in PLAN.md's
  # post-v0.1 backlog as a v0.2 ast-grep enhancement (multi-line AST
  # query rather than line-based regex).
  #
  # Pattern rationale: `-> .*SecretBox.*SecretBox` matches any line that
  # contains a `->` return-type arrow followed (anywhere on the same line) by
  # two or more `SecretBox` tokens.  This correctly catches:
  #   fn load_two() -> Result<(SecretBox<RelayEd25519Key>, SecretBox<…>), …>
  # because both `SecretBox` tokens appear after `->` on the same line.
  #
  # Correctness check for the `!` inversion:
  #   - Zero matches → rg exits 1 → `! rg …` exits 0 → step passes.  ✓
  #   - Matches found → rg exits 0 → `! rg …` exits 1 → step fails.  ✓
  # Smoke-tested locally (see commit message) by temporarily inserting
  # `pub fn load_two() -> Result<(SecretBox<RelayEd25519Key>, SecretBox<TenantSecp256k1Key>), …>`
  # and confirming the SecretBox gate triggered; line was removed before commit.
  multi-key-return-gate:
    name: Multi-key-return regex gate (R2 trust-boundary isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Multi-key-return regex gate (R2 trust-boundary isolation)
        # `-U` enables ripgrep multi-line mode so `[^)]` spans newlines.
        # Without it, the regex misses rustfmt-broken multiline tuple
        # returns like `fn foo() -> (\n  SecretBox<A>,\n  SecretBox<B>,\n)`,
        # which a contributor would produce by running `cargo fmt` after
        # writing a one-line tuple return. The pattern matches any tuple
        # return type containing the forbidden ident at least twice
        # before the closing paren — both shapes are caught.
        run: |
          ! rg -U --type rust -e '-> \([^)]*SecretBox[^)]*SecretBox' crates/portal-crypto crates/portal-relay crates/portal-sdk crates/portal-net
          ! rg -U --type rust -e '-> \([^)]*SigningKey[^)]*SigningKey' crates/portal-crypto crates/portal-relay crates/portal-sdk crates/portal-net

  nextest:
    name: cargo nextest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.95", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --no-fail-fast

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Phase 5 U1: cargo-vet supply-chain audit. Warn-only during Phase 5
  # per the Mozilla cargo-vet book's incremental-adoption posture
  # (`continue-on-error: true`). Promotes to a blocking gate in Phase 7
  # release work once the workspace's own audit corpus has been
  # bootstrapped via `cargo vet certify`.
  cargo-vet:
    name: cargo vet check (warn-only, Phase 5)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet
      - run: cargo vet check

  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@main

  msrv:
    name: cargo msrv verify (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv
      - run: cargo msrv verify --path .

  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - run: cargo llvm-cov --workspace --no-fail-fast --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  # Phase 7 U8.8 — utoipa coverage gate (belt-and-suspenders to clippy
  # `disallowed-methods` in `clippy.toml`).
  #
  # Library crates (`portal-relay`, `portal-sdk`) MUST register routes via
  # `utoipa_axum::OpenApiRouter::route` / `OpenApiRouter::nest`. Direct calls
  # to `axum::Router::route` / `Router::nest` from a library crate bypass the
  # OpenAPI registration silently. Clippy `disallowed-methods` operates on
  # resolved Rust paths (defeated by import alias); ast-grep operates on
  # syntactic shape (defeated by macro expansion). Together they catch each
  # other's blind spots — see docs/utoipa-coverage-policy.md.
  #
  # Binary crates (`portal-relay-bin`, `portal-cli`, `portal-demo`) compose
  # finalised routers at the mount site; they may locally bypass with
  # `#[expect(clippy::disallowed_methods, reason = "<reason>")]` per the policy.
  utoipa-coverage-gate:
    name: utoipa coverage gate (Phase 7 U8.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: ast-grep
      - name: Library crates must use OpenApiRouter::route / OpenApiRouter::nest
        run: |
          set -euo pipefail
          # Coverage split:
          #   - clippy `disallowed-methods` (workspace `clippy.toml`) is the
          #     PRIMARY gate. It resolves `axum::Router::route` / `Router::nest`
          #     by DefId, so it catches both the associated-fn shape
          #     `Router::route(&mut r, ...)` and the method-call shape
          #     `r.route(...)` regardless of import alias.
          #   - This ast-grep step is BELT-AND-SUSPENDERS for source-shape
          #     evasions clippy can miss (typically: macro-expanded code that
          #     does not surface to the lint pass; cfg-disabled code paths).
          #     We pattern-match the canonical chained-builder forms
          #     `Router::new().route(...)` and `Router::new().nest(...)`,
          #     plus the qualified `axum::Router::new().route(...)`. Bound-to-
          #     var rebinds (`let r = Router::new(); r.route(...)`) are caught
          #     by clippy via type resolution, not by this step.
          # ast-grep exit code: 0 always (match output goes to stdout).
          # CI gate: any non-empty output = fail.
          matches="$(
            ast-grep run --pattern 'Router::new().route($$$ARGS)' \
              --lang rust crates/portal-relay/src crates/portal-sdk/src
            ast-grep run --pattern 'Router::new().nest($$$ARGS)' \
              --lang rust crates/portal-relay/src crates/portal-sdk/src
            ast-grep run --pattern 'axum::Router::new().route($$$ARGS)' \
              --lang rust crates/portal-relay/src crates/portal-sdk/src
            ast-grep run --pattern 'axum::Router::new().nest($$$ARGS)' \
              --lang rust crates/portal-relay/src crates/portal-sdk/src
          )"
          if [ -n "$matches" ]; then
            echo "::error::U8.8 utoipa coverage gate: library crates must call utoipa_axum::OpenApiRouter::route / OpenApiRouter::nest, not axum::Router. See docs/utoipa-coverage-policy.md."
            echo "$matches"
            exit 1
          fi

  # Phase 7 U8.7 — dep-spawning audit gate.
  #
  # Validates that `docs/dep-spawning-audit.md` carries every required dep
  # contract section (quinn, axum+hyper, instant-acme, defguard_boringtun,
  # plus the Per-dep contracts table and the R9 honest-claim section). The
  # `xtask dep-audit` validator detects ATX headings only — fenced code
  # blocks and blockquotes containing the literal section text do not
  # satisfy the gate (see xtask/src/dep_audit.rs unit tests for the bypass
  # cases).
  dep-spawning-audit-gate:
    name: dep-spawning audit (Phase 7 U8.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask --quiet -- dep-audit

  rustls-mandatory:
    name: cargo tree -i openssl returns empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Assert no transitive openssl
        run: |
          if cargo tree --workspace --no-default-features -i openssl 2>/dev/null | grep -q .; then
            echo "::error::transitive openssl pulled — rustls-MANDATORY (R13) violated. See ADR-0002."
            cargo tree --workspace -i openssl
            exit 1
          fi
