# git-cliff configuration — conventional-commit-driven changelog generation.
#
# Phase 7 U8.10 first slice. Consumed by `cargo release`'s
# `pre-release-replacements` hook (see release.toml) to regenerate
# CHANGELOG.md at tag time. The cross-compile matrix workflow
# (.github/workflows/release.yml) lands separately when Phase 6b/B U6+U7
# pin the WG-fork-aware matrix shape.
#
# Commit-message convention follows the workspace's existing pattern (see
# git log on `refact/rework`): `<type>[(!)][scope]: <description>`. Types
# accepted by this config map verbatim to the workspace convention.

[changelog]
# Top-of-file static header (rendered once, always).
header = """
# Changelog

All notable changes to portal-tunnel-rs are documented in this file. The
format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This file is regenerated by `git cliff` at tag time via `cargo release`'s
post-tag hook (Phase 7 U8.10). Manual edits between releases are
overwritten on the next tag — record durable notes in the matching
`docs/release-notes/v*.md` template instead.

"""

# Per-release body template. `commits` is grouped by `group` (set by the
# commit_parsers below). Each commit renders as a single line with its
# subject line.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

# Bottom-of-file static footer.
footer = """
<!-- Generated by git-cliff at tag time. See cliff.toml. -->
"""

# Strip surrounding whitespace from rendered output.
trim = true

[git]
# Only emit groups for conventional-commit-shaped messages.
conventional_commits = true

# Skip non-conventional commits entirely (silent — they don't appear under
# a generic group). Workspace convention requires conventional-commit
# shape on every commit; the few historical non-conventional commits
# predate the convention and are intentionally omitted from the
# changelog.
filter_unconventional = true

# `false` keeps merge commits visible; portal-tunnel-rs does not use
# merge commits on `refact/rework` (detached-HEAD + git-branchless
# workflow per AGENTS.md), so this is effectively a no-op today.
filter_commits = false

# Oldest-to-newest within a release section so contributors see the
# implementation order rather than reverse chronology.
sort_commits = "oldest"

# Commit-message regex parsers map raw commit subjects to changelog
# groups. Order matters: the first matching pattern wins.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI" },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverts" },
    { message = "^style", group = "Style" },
    # Catch-all: any conventional-commit type not enumerated above.
    # Keeps the changelog from silently dropping a new type if someone
    # introduces one without updating this config.
    { message = ".*", group = "Other" },
]
